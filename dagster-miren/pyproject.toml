[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagster-miren"
version = "0.1.0"
description = "Finite Miren workers for Dagster runs"
requires-python = ">=3.10"
dependencies = ["dagster==1.12.21", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "dagster-postgres==0.28.21", "sqlalchemy<2.1"]

[tool.setuptools.packages.find]
include = ["dagster_miren*"]
